name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair projeto
        run: |
          test -f projeto-apk.zip || { echo "Envie o arquivo projeto-apk.zip"; exit 1; }
          mkdir app && unzip -q projeto-apk.zip -d app
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Build web
        working-directory: app
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap sync android
      - name: Build APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GDL-CheckList-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
